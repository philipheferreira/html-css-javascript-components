<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yu-Gi-Oh! Card Finder (Promises)</title>
    <style>
        /* CSS idêntico aos anteriores */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a2e; color: #fff; min-height: 100vh; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #e94560; text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .search-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; flex-wrap: wrap; }
        input { padding: 12px 20px; width: 300px; border: none; border-radius: 5px; font-size: 16px; background-color: #16213e; color: #fff; border: 2px solid #0f3460; outline: none; }
        input:focus { border-color: #e94560; }
        button { padding: 12px 24px; background-color: #e94560; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #d13d56; }
        #card-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; }
        .card { background-color: #16213e; border-radius: 10px; padding: 15px; width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: transform 0.3s, box-shadow 0.3s; display: flex; flex-direction: column; align-items: center; }
        .card:hover { transform: translateY(-10px); box-shadow: 0 10px 25px rgba(233, 69, 96, 0.3); }
        .card img { width: 100%; border-radius: 5px; margin-bottom: 15px; }
        .card-title { font-size: 1.1em; color: #e94560; margin-bottom: 5px; text-align: center; }
        .card-type { font-size: 0.9em; color: #aaa; margin-bottom: 10px; }
        .card-desc { font-size: 0.85em; color: #ddd; text-align: justify; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
        #loading { text-align: center; font-size: 1.2em; color: #e94560; display: none; }
    </style>
</head>
<body>

    <header>
        <h1>Yu-Gi-Oh! Promise Version</h1>
    </header>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Nome da carta... (Ex: Blue-Eyes)">
        <button onclick="searchCard()">Buscar</button>
        <button onclick="getRandomCard()">Carta Aleatória</button>
    </div>

    <div id="loading">Carregando...</div>
    <div id="card-container"></div>

    <script>
        const container = document.getElementById('card-container');
        const loading = document.getElementById('loading');
        const searchInput = document.getElementById('search-input');

        function toggleLoading(show) {
            loading.style.display = show ? 'block' : 'none';
        }

        function createCardElement(cardData) {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';
            const imageUrl = cardData.card_images[0].image_url;
            cardDiv.innerHTML = `
                <img src="${imageUrl}" alt="${cardData.name}">
                <h3 class="card-title">${cardData.name}</h3>
                <p class="card-type">${cardData.type} ${cardData.race ? '| ' + cardData.race : ''}</p>
                <p class="card-desc">${cardData.desc}</p>
            `;
            return cardDiv;
        }

        // ==========================================
        // LÓGICA COM PROMISES (.then, .catch, .finally)
        // ==========================================

        function searchCard() {
            const query = searchInput.value.trim();
            if (!query) {
                alert('Por favor, digite o nome de uma carta.');
                return;
            }

            container.innerHTML = '';
            toggleLoading(true);

            const url = `https://db.ygoprodeck.com/api/v7/cardinfo.php?fname=${encodeURIComponent(query)}`;

            // fetch() Retorna uma PROMISE
            fetch(url)
                .then(function(response) {
                    // 1º THEN: A requisição chegou. Vamos verificar se deu certo (Status 200) e converter para JSON.
                    if (!response.ok) {
                        throw new Error('Erro de rede. Status: ' + response.status);
                    }
                    // response.json() TAMBÉM retorna uma Promise!
                    return response.json(); 
                })
                .then(function(data) {
                    // 2º THEN: Os dados JSON já foram parseados. Hora de processar.
                    
                    // Truque importante: A API do Yu-Gi-Oh retorna HTTP 200 mesmo se não achar a carta.
                    // Ela manda um objeto { error: "..." }. Vamos tratar isso forçando um erro.
                    if (data.error) {
                        throw new Error(data.error); // Se lançar um erro aqui, ele pula direto para o .catch()
                    }

                    // Se não tiver erro, renderizamos as cartas
                    data.data.forEach(function(card) {
                        container.appendChild(createCardElement(card));
                    });
                })
                .catch(function(erro) {
                    // CATCH: Se qualquer erro acontecer nos .then() acima (ou se a internet cair), cai aqui.
                    console.error("Falha na Promise:", erro);
                    container.innerHTML = `<p style="color: #e94560;">Falha ao buscar: ${erro.message}</p>`;
                })
                .finally(function() {
                    // FINALLY: Executa SEMPRE, no final de tudo, deu certo ou deu erro.
                    // Perfeito para esconder o loading.
                    toggleLoading(false);
                });
        }

        function getRandomCard() {
            container.innerHTML = '';
            toggleLoading(true);

            fetch('https://db.ygoprodeck.com/api/v7/randomcard.php')
                .then(function(response) {
                    if (!response.ok) throw new Error('Erro de rede');
                    return response.json();
                })
                .then(function(data) {
                    // Como o endpoint randomcard.php não retorna o objeto "error", podemos renderizar direto
                    container.appendChild(createCardElement(data));
                })
                .catch(function(erro) {
                    container.innerHTML = `<p style="color: #e94560;">Falha ao buscar: ${erro.message}</p>`;
                })
                .finally(function() {
                    toggleLoading(false);
                });
        }

        // Atalho do teclado
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchCard();
        });

        // Inicia a página
        getRandomCard();

    </script>
</body>
</html>
