<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yu-Gi-Oh! Card Finder (Async/Await)</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <header>
        <h1>Yu-Gi-Oh! Async/Await Version</h1>
    </header>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Nome da carta... (Ex: Blue-Eyes)">
        <button onclick="searchCard()">Buscar</button>
        <button onclick="getRandomCard()">Carta Aleatória</button>
    </div>

    <div id="loading">Carregando...</div>
    <div id="card-container"></div>

    <script src="script.js"></script>
</body>
</html>
