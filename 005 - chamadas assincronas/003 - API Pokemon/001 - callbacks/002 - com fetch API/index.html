<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex com Callbacks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pokédex (Estudo de Callback)</h1>
        
        <div class="search-box">
            <input type="text" id="pokemonInput" placeholder="Digite o nome ou ID (ex: pikachu ou 25)">
            <button id="searchBtn">Buscar</button>
        </div>

        <!-- Mensagens de estado -->
        <div id="loading" class="hidden">Carregando...</div>
        <div id="error" class="hidden error-msg"></div>

        <!-- Card do Pokemon -->
        <div id="pokemonCard" class="card hidden">
            <img id="pokemonImg" src="" alt="Imagem do Pokemon">
            <h2 id="pokemonName"></h2>
            <p id="pokemonType"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
